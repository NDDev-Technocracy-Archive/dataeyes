name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.17', '3.12.15']
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      python-version: ${{ matrix.python }}
      uv-version: '0.13.5'
      tools: ruff@0.17.5
      prepare: setup
      recipe: verify
      reports: ci-reports/python.xml
      timeout-minutes: 20

  semgrep:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      python-version: '3.11.17'
      uv-version: '0.13.5'
      recipe: ci-semgrep
      timeout-minutes: 15

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read

  gate:
    needs: [python, semgrep, merge-stops]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every component and security check
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"python":"success","semgrep":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
